# Triggered when a vX.Y.Z tag is pushed to main (by tag.yml after a release PR merge).
# Builds a self-contained Windows installer with Velopack and a self-contained
# linux-x64 .deb, and attaches both to the same GitHub Release.
name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    name: Build & Publish Installer (Windows)
    runs-on: windows-2022
    permissions:
      contents: write

    env:
      SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
      SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content version.json | ConvertFrom-Json).version
          echo "version=$v" >> $env:GITHUB_OUTPUT
          echo "tag=v$v" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore

      - name: Build & Test
        run: |
          dotnet build --no-restore --configuration Release -warnaserror
          dotnet test  --no-build  --configuration Release

      - name: Publish (self-contained win-x64)
        run: >
          dotnet publish src/KubeTools4Dev/KubeTools4Dev.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish/
          /p:DebugType=embedded

      - name: Install Velopack CLI
        run: dotnet tool install --global vpk

      - name: Pack installer
        shell: pwsh
        run: |
          vpk pack `
            --packId   KubeTools4Dev `
            --packVersion "${{ steps.version.outputs.version }}" `
            --packDir  publish/ `
            --mainExe  KubeTools4Dev.exe `
            --icon     src/KubeTools4Dev/Assets/app-icon.ico `
            --outputDir installer/out/

      - name: Sign main EXE
        if: ${{ env.SIGNING_CERT_BASE64 != '' }}
        shell: pwsh
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))

          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
                        Where-Object { $_.FullName -like '*x64*' } |
                        Sort-Object FullName -Descending |
                        Select-Object -First 1 -ExpandProperty FullName
          if ($null -eq $signtool) { throw 'signtool.exe not found in Windows SDK. Ensure windows-2022 runner is used.' }

          & $signtool sign /fd SHA256 /p $env:SIGNING_CERT_PASSWORD /f $certPath `
            /t http://timestamp.digicert.com `
            publish/KubeTools4Dev.exe

          if ($LASTEXITCODE -ne 0) { throw "signtool failed for main EXE" }
          Write-Host 'Signed: publish/KubeTools4Dev.exe' -ForegroundColor Green
          Remove-Item $certPath -Force

      - name: Sign installer EXE
        if: ${{ env.SIGNING_CERT_BASE64 != '' }}
        shell: pwsh
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))

          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
                        Where-Object { $_.FullName -like '*x64*' } |
                        Sort-Object FullName -Descending |
                        Select-Object -First 1 -ExpandProperty FullName
          if ($null -eq $signtool) { throw 'signtool.exe not found in Windows SDK. Ensure windows-2022 runner is used.' }

          $setup = Get-ChildItem 'installer/out/' -Filter '*Setup.exe' | Select-Object -First 1
          if ($null -eq $setup) { throw 'No *-Setup.exe found in installer/out/ — vpk pack may have failed.' }
          & $signtool sign /fd SHA256 /p $env:SIGNING_CERT_PASSWORD /f $certPath `
            /t http://timestamp.digicert.com `
            $setup.FullName

          if ($LASTEXITCODE -ne 0) { throw "signtool failed for installer" }
          Write-Host "Signed: $($setup.Name)" -ForegroundColor Green
          Remove-Item $certPath -Force

      - name: Rename artifacts
        shell: pwsh
        run: |
          $setup = Get-ChildItem "installer/out/" -Filter "*Setup.exe" | Select-Object -First 1
          if ($setup) {
            Rename-Item -Path $setup.FullName -NewName "KubeTools4Dev-Setup-${{ steps.version.outputs.version }}.exe"
          }
          $portable = Get-ChildItem "installer/out/" -Filter "*Portable.zip" | Select-Object -First 1
          if ($portable) {
            Rename-Item -Path $portable.FullName -NewName "KubeTools4Dev-Portable-${{ steps.version.outputs.version }}.zip"
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: KubeTools4Dev ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            installer/out/*.exe
            installer/out/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-linux:
    name: Build & Publish Installer (Linux .deb)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read version
        id: version
        run: |
          v=$(jq -r .version version.json)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v"    >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore

      - name: Publish (self-contained linux-x64)
        run: >
          dotnet publish src/KubeTools4Dev/KubeTools4Dev.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          --output publish-linux/
          /p:DebugType=embedded

      - name: Build .deb
        run: |
          bash packaging/linux/build-deb.sh \
            --publish-dir publish-linux \
            --version     "${{ steps.version.outputs.version }}" \
            --out-dir     installer/out-linux

      - name: Upload .deb to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: KubeTools4Dev ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: installer/out-linux/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-apt-repo:
    # Gated on the maintainer flipping APT_REPO_ENABLED=true after completing
    # the one-time setup documented in docs/maintainer/apt-repo-setup.md
    # (GPG key gen, gh-pages bootstrap, repo secrets, enable Pages).
    name: Publish to apt repository
    runs-on: ubuntu-latest
    needs: publish-linux
    if: ${{ vars.APT_REPO_ENABLED == 'true' }}
    permissions:
      contents: write

    env:
      GPG_KEY_ID:     ${{ secrets.APT_REPO_GPG_KEY_ID }}
      GPG_PASSPHRASE: ${{ secrets.APT_REPO_GPG_PASSPHRASE }}

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref:  gh-pages
          path: site

      - name: Read version
        id: version
        # NOTE: this job checks out the `gh-pages` branch (not `main`), so
        # version.json isn't on disk. Pulling it through the GitHub Contents
        # API and base64-decoding is the simplest way to read it without
        # adding a second checkout step.
        run: |
          v=$(gh api repos/${{ github.repository }}/contents/version.json \
                --jq '.content' | base64 -d | jq -r .version)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v"    >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download .deb from the GitHub Release
        run: |
          mkdir -p dl
          gh release download "${{ steps.version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern '*.deb' \
            --dir dl
          ls -la dl/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage .deb into pool
        run: |
          install -d site/pool/main/k/kubetools4dev
          cp dl/*.deb site/pool/main/k/kubetools4dev/

      - name: Install apt-utils + gpg
        run: sudo apt-get update && sudo apt-get install -y apt-utils gnupg

      - name: Import signing key
        # `gpg --import-ownertrust` requires the full 40-char fingerprint;
        # the long key ID we store in APT_REPO_GPG_KEY_ID is rejected with
        # "invalid fingerprint". Derive the fingerprint from the imported key.
        run: |
          echo "$APT_REPO_GPG_PRIVATE_KEY" | gpg --batch --import
          FPR=$(gpg --with-colons --fingerprint "$GPG_KEY_ID" \
                  | awk -F: '/^fpr:/ {print $10; exit}')
          if [ -z "$FPR" ]; then
            echo "::error::Could not derive fingerprint for key id $GPG_KEY_ID after import."
            exit 1
          fi
          echo "$FPR:6:" | gpg --import-ownertrust
        env:
          APT_REPO_GPG_PRIVATE_KEY: ${{ secrets.APT_REPO_GPG_PRIVATE_KEY }}

      - name: Regenerate Packages indexes
        working-directory: site
        run: |
          # git doesn't track empty dirs, so the gh-pages bootstrap's
          # mkdir doesn't survive into a checkout. Recreate on demand.
          mkdir -p dists/stable/main/binary-amd64
          apt-ftparchive packages pool/main \
            > dists/stable/main/binary-amd64/Packages
          gzip -9c dists/stable/main/binary-amd64/Packages \
            > dists/stable/main/binary-amd64/Packages.gz
          xz   -9c dists/stable/main/binary-amd64/Packages \
            > dists/stable/main/binary-amd64/Packages.xz

      - name: Regenerate Release file
        working-directory: site
        run: |
          cat > /tmp/apt-ftparchive.conf <<'EOF'
          APT::FTPArchive::Release::Origin "DevDogs";
          APT::FTPArchive::Release::Label "KubeTools4Dev";
          APT::FTPArchive::Release::Suite "stable";
          APT::FTPArchive::Release::Codename "stable";
          APT::FTPArchive::Release::Architectures "amd64";
          APT::FTPArchive::Release::Components "main";
          APT::FTPArchive::Release::Description "KubeTools4Dev apt repository";
          EOF
          apt-ftparchive -c /tmp/apt-ftparchive.conf release dists/stable \
            > dists/stable/Release

      - name: Sign Release (detached + clearsigned)
        working-directory: site
        # Passphrase is read from fd 0 (heredoc) instead of being passed as a
        # CLI argument — keeps it out of /proc/<pid>/cmdline and `ps aux`.
        run: |
          gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 \
              --default-key "$GPG_KEY_ID" \
              --detach-sign --armor \
              -o dists/stable/Release.gpg \
              dists/stable/Release <<<"$GPG_PASSPHRASE"

          gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 \
              --default-key "$GPG_KEY_ID" \
              --clearsign \
              -o dists/stable/InRelease \
              dists/stable/Release <<<"$GPG_PASSPHRASE"

      - name: Commit + push to gh-pages
        working-directory: site
        run: |
          git config user.name  "kubetools4dev-bot"
          git config user.email "noreply@devildogtg.dmnsn.com"
          git add pool dists
          if git diff --cached --quiet; then
            echo "::notice::Nothing to commit — pool and dists unchanged."
          else
            git commit -m "release: ${{ steps.version.outputs.tag }} into apt stable"
            git push origin gh-pages
          fi
