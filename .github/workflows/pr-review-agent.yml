name: PR Review Agent

on:
  # Auto-trigger: fires when Copilot bot submits a review
  pull_request_review:
    types: [submitted]

  # Manual trigger: run against any PR by number from the Actions UI
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to process'
        required: true
        type: number

  # Chat trigger: comment /run-agent on any PR to kick off the agent
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check-copilot-review:
    name: Check Copilot Review
    runs-on: ubuntu-latest
    # Guard: skip for issue_comment events that are not /run-agent on a PR,
    # and skip pull_request_review events not from the Copilot bot on develop.
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/run-agent')) ||
      (github.event_name == 'pull_request_review' &&
       github.event.pull_request.base.ref == 'develop' &&
       github.event.review.user.login == 'copilot-pull-request-reviewer[bot]' &&
       github.event.review.state == 'COMMENTED')
    outputs:
      has_comments: ${{ steps.parse.outputs.has_comments }}
      pr_number: ${{ steps.parse.outputs.pr_number }}
      head_ref: ${{ steps.parse.outputs.head_ref }}
      comment_summary: ${{ steps.parse.outputs.comment_summary }}
    steps:
      - name: Parse review comments
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            // Resolve PR number from whichever trigger fired
            let prNumber;
            if (context.eventName === 'workflow_dispatch') {
              prNumber = Number(context.payload.inputs.pr_number);
            } else if (context.eventName === 'issue_comment') {
              prNumber = context.payload.issue.number;
            } else {
              prNumber = context.payload.pull_request.number;
            }

            // Fetch PR details to get the head ref
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              pull_number: prNumber,
            });
            const headRef = pr.head.ref;

            // Fetch all unresolved review threads
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              pull_number: prNumber,
            });

            const copilotReview = reviews.find(
              r => r.user.login === 'copilot-pull-request-reviewer[bot]'
            );

            if (!copilotReview) {
              core.setOutput('has_comments', 'false');
              return;
            }

            const { data: comments } = await github.rest.pulls.listReviewComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              pull_number: prNumber,
            });

            const copilotComments = comments.filter(
              c => c.user.login === 'copilot-pull-request-reviewer[bot]'
            );

            if (copilotComments.length === 0) {
              core.setOutput('has_comments', 'false');
              return;
            }

            // Build a summary to use as context for the coding agent
            const summary = copilotComments.map(c =>
              `### Issue in \`${c.path}\` (line ${c.line ?? c.original_line})\n${c.body}`
            ).join('\n\n');

            core.setOutput('has_comments', 'true');
            core.setOutput('pr_number',      String(prNumber));
            core.setOutput('head_ref',        headRef);
            core.setOutput('comment_summary', summary);

            console.log(`Found ${copilotComments.length} Copilot comment(s) on PR #${prNumber}`);

  fix-issues:
    name: Fix Issues with Copilot Coding Agent
    needs: check-copilot-review
    if: needs.check-copilot-review.outputs.has_comments == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-copilot-review.outputs.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post agent task comment
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = Number('${{ needs.check-copilot-review.outputs.pr_number }}');
            const summary  = `${{ needs.check-copilot-review.outputs.comment_summary }}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: prNumber,
              body: [
                '## 🤖 PR Review Agent',
                '',
                'Copilot review detected. Delegating the following issues to **Copilot coding agent** for automated fixes:',
                '',
                summary,
                '',
                '_Agent is now working on fixes. Build & test results will follow._',
              ].join('\n'),
            });

      # Invoke the Copilot coding agent to address each comment.
      # The agent reads copilot-setup-steps.yml automatically to bootstrap the environment.
      - name: Run Copilot coding agent
        uses: github/copilot-agent-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You are a senior .NET engineer. Address every Copilot code-review comment listed below
            by making the minimal, correct change to the source files in this repository.
            After fixing, run `dotnet build KubeTools4Dev.sln` to verify the build passes.
            Commit all changes with message: "fix: address Copilot review comments [automated]"

            --- REVIEW COMMENTS ---
            ${{ needs.check-copilot-review.outputs.comment_summary }}

  build-and-test:
    name: Build & Test
    needs: [check-copilot-review, fix-issues]
    if: always() && needs.check-copilot-review.outputs.has_comments == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-copilot-review.outputs.head_ref }}
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore KubeTools4Dev.sln

      - name: Build
        id: build
        run: dotnet build KubeTools4Dev.sln --no-restore --configuration Release 2>&1 | tee build.log
        continue-on-error: true

      - name: Test
        id: test
        run: dotnet test KubeTools4Dev.sln --no-build --configuration Release --logger "trx;LogFileName=results.trx" 2>&1 | tee test.log
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-pr-${{ needs.check-copilot-review.outputs.pr_number }}
          path: |
            **/*.trx
            build.log
            test.log

      - name: Report results to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber  = Number('${{ needs.check-copilot-review.outputs.pr_number }}');
            const buildOk   = '${{ steps.build.outcome }}' === 'success';
            const testOk    = '${{ steps.test.outcome }}' === 'success';

            const icon    = (buildOk && testOk) ? '✅' : '❌';
            const verdict = (buildOk && testOk) ? 'All checks passed' : 'Some checks failed — human review required';

            const lines = [
              `## ${icon} Build & Test Report`,
              '',
              `| Check | Result |`,
              `|-------|--------|`,
              `| 🔨 Build | ${buildOk ? '✅ Passed' : '❌ Failed'} |`,
              `| 🧪 Test  | ${testOk  ? '✅ Passed' : '❌ Failed'} |`,
              '',
              `**${verdict}**`,
            ];

            if (!buildOk || !testOk) {
              lines.push('', '> Artifacts with full logs are attached to this workflow run.');
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: prNumber,
              body: lines.join('\n'),
            });
